name = "app-parceiros"
main = "src/worker.js"
compatibility_date = "2025-01-01"
workers_dev = false

# interface PWA servida como arquivos estáticos; só /api/* passa pelo Worker
[assets]
directory = "./src/web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# os testes barram a publicação: se `node --test` falhar, não há deploy
[build]
command = "node --test"

[[d1_databases]]
binding = "DB"
database_name = "parceiros"
database_id = "PREENCHER-APOS-CRIAR-O-BANCO"
migrations_dir = "migracoes"

# R2 (fotos) entra na Fase 2
# [[r2_buckets]]
# binding = "FOTOS"
# bucket_name = "parceiros-fotos"

[vars]
AMBIENTE = "teste"          # teste | producao
MENSAGERIA = "falsa"        # falsa (só teste) | real (Fase 9)
ADMIN_CELULARES = ""        # celulares dos primeiros admins (55 + DDD + número), separados por vírgula

# segredo obrigatório (não vai aqui): npx wrangler secret put SEGREDO_APP

[observability]
enabled = true
